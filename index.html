<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>lifysh</title>
<meta name="description" content="lifysh · 正在建设中">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F3B57'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
/* 占位页：大号字标 + 一行说明，系统字体（国内也能快速打开） */
:root{
  --bg:#F2F4F3;
  --ink:#1F3B57;
  --muted:#6B7C8A;
  --sun:#E8A33D;
  --line:#D5DCDF;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#111A22;--ink:#E4ECF2;--muted:#8C9CAA;--sun:#F0B44F;--line:#24323E;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:960px;width:100%;margin:0 auto}
.mark{position:relative;align-self:flex-start;font-weight:800;font-size:clamp(64px,18vw,180px);line-height:.9;letter-spacing:-.045em;margin:0}
.mark .sun{position:absolute;width:.16em;height:.16em;border-radius:50%;background:var(--sun);right:-.2em;top:.02em}
@media (prefers-reduced-motion:no-preference){
  .mark .sun{animation:rise 3.6s ease-in-out infinite alternate}
  @keyframes rise{from{transform:translateY(.05em)}to{transform:translateY(-.05em)}}
}
.line{margin:.5em 0 0;font-size:clamp(16px,2vw,18px);margin-top:clamp(40px,6vw,64px);padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;max-width:560px}
.line b{font-weight:600;font-size:18px}
.line span{color:var(--muted);font-size:15px}
footer{max-width:960px;width:100%;margin:0 auto;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1 class="mark">lifysh<span class="sun" aria-hidden="true"></span></h1>
  <div class="line"><b>正在建设中</b><span>Something new is on the way.</span></div>
</main>
<footer>© 2026 lifysh.com</footer>
</body>
</html>
